      @keyframes reveal {
        from { opacity: 0; }
        to   { opacity: 1; }
      }

      .cursor {
        animation: blink 1s step-end infinite;
        animation-delay: 3.5s;
        opacity: 0;
      }
      @keyframes blink {
        0%,100% { opacity: 1; }
        50%      { opacity: 0; }
      }

      .fade-in { animation: reveal 0.3s 0.1s both; }
