<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#1A1A1A" stop-opacity="1"/>
      <stop offset="50%" stop-color="#090909" stop-opacity="1"/>
      <stop offset="100%" stop-color="#050505" stop-opacity="1"/>
    </radialGradient>

    <!-- Gold Spark Aura -->
    <radialGradient id="sparkGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="1"/>
      <stop offset="30%" stop-color="#8A6A15" stop-opacity="0.75"/>
      <stop offset="70%" stop-color="#090909" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
    </radialGradient>

    <!-- Hand Gradients with Metallic Gold Tinting -->
    <linearGradient id="handLeftGrad" x1="0%" y1="20%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#F5F5F5"/>
      <stop offset="45%" stop-color="#D4AF37"/>
      <stop offset="80%" stop-color="#8A6A15"/>
      <stop offset="100%" stop-color="#1A1A1A"/>
    </linearGradient>

    <linearGradient id="handRightGrad" x1="100%" y1="80%" x2="0%" y2="20%">
      <stop offset="0%" stop-color="#F5F5F5"/>
      <stop offset="45%" stop-color="#D4AF37"/>
      <stop offset="80%" stop-color="#8A6A15"/>
      <stop offset="100%" stop-color="#090909"/>
    </linearGradient>

    <!-- Gold Cyber Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#8A6A15" stroke-width="0.5" stroke-opacity="0.3"/>
      <circle cx="40" cy="40" r="1" fill="#D4AF37" opacity="0.3"/>
    </pattern>

    <!-- Neon Gold Glow Filter -->
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur1"/>
      <feGaussianBlur stdDeviation="15" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="intenseSpark" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2" result="b1"/>
      <feGaussianBlur stdDeviation="8" result="b2"/>
      <feMerge>
        <feMergeNode in="b2"/>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="windowShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#000000" flood-opacity="0.95"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="460" fill="url(#bgGlow)" rx="12"/>
  <rect width="1200" height="460" fill="url(#cyberGrid)" rx="12"/>

  <!-- Ambient Gold Light/Glow behind touch point -->
  <circle cx="540" cy="230" r="240" fill="url(#sparkGlow)" opacity="0.35" filter="url(#neonGlow)"/>
  
  <!-- Subtle Background Constellation / Gold Sparks -->
  <g opacity="0.5">
    <circle cx="150" cy="90" r="1.5" fill="#D4AF37"/>
    <circle cx="280" cy="380" r="1.2" fill="#8A6A15"/>
    <circle cx="950" cy="80" r="1.5" fill="#D4AF37"/>
    <circle cx="1050" cy="390" r="1" fill="#F5F5F5"/>
    <circle cx="70" cy="270" r="1" fill="#8A6A15"/>
    <circle cx="1120" cy="180" r="1.5" fill="#D4AF37"/>
  </g>

  <!-- ==================== LEFT HAND (GOD'S HAND) ==================== -->
  <g id="leftHandGroup">
    <!-- Outer Glow Silhouette -->
    <path d="M -20,60 
             C 80,85 160,110 220,135 
             C 270,155 310,175 355,190 
             C 385,200 420,205 460,215 
             C 485,220 505,223 522,225
             C 525,225.5 526,227 522,229
             C 495,235 460,245 440,250
             C 410,258 385,255 365,245
             C 335,270 305,280 270,270
             C 240,260 215,240 190,225
             C 120,200 40,170 -20,150 Z" 
          fill="#D4AF37" opacity="0.2" filter="url(#neonGlow)"/>

    <!-- Main Left Hand Solid Path -->
    <path d="M -30,50 
             C 70,78 150,105 215,130 
             C 260,148 295,168 340,182 
             C 375,193 425,202 468,212 
             C 492,217 512,221 525,224
             C 530,225 530,227 524,228.5
             C 502,233 475,239 455,243
             C 445,245 440,248 448,252
             C 468,260 488,262 480,268
             C 470,272 445,270 425,263
             C 415,260 410,263 416,268
             C 430,278 450,282 440,287
             C 425,293 395,285 375,275
             C 355,265 342,250 328,245
             C 315,255 295,265 265,262
             C 230,258 200,235 175,218
             C 105,190 25,155 -30,130 Z" 
          fill="url(#handLeftGrad)" stroke="#8A6A15" stroke-width="1.5"/>

    <!-- Left Hand Details & Shading Lines -->
    <path d="M 120,135 C 190,160 250,185 320,202" fill="none" stroke="#090909" stroke-width="2" opacity="0.7"/>
    <path d="M 200,145 C 270,172 350,195 450,215" fill="none" stroke="#F5F5F5" stroke-width="1.5" opacity="0.8"/>
    <path d="M 290,175 C 340,190 410,205 480,218" fill="none" stroke="#D4AF37" stroke-width="1.2" opacity="0.9"/>
    
    <!-- Finger Joints -->
    <path d="M 375,193 C 425,202 475,213 523,224" fill="none" stroke="#090909" stroke-width="2" opacity="0.5"/>
    <path d="M 430,204 Q 435,212 442,216" fill="none" stroke="#8A6A15" stroke-width="1.5"/>
    <path d="M 475,214 Q 480,221 486,223" fill="none" stroke="#8A6A15" stroke-width="1.5"/>

    <!-- Middle Finger Bend -->
    <path d="M 360,208 C 400,220 440,230 472,234 C 478,235 476,242 465,243 C 435,245 400,238 365,225" fill="#1A1A1A" opacity="0.5"/>
    <path d="M 430,228 C 455,235 475,238 478,240" fill="none" stroke="#D4AF37" stroke-width="1" opacity="0.6"/>

    <!-- Ring Finger Bend -->
    <path d="M 345,220 C 380,235 420,248 450,253 C 458,254 454,262 440,261 C 410,258 375,245 345,232" fill="#090909" opacity="0.6"/>
    
    <!-- Pinky Finger Bend -->
    <path d="M 330,230 C 360,245 400,260 425,265 C 432,266 428,272 418,270 C 390,265 360,250 330,238" fill="#090909" opacity="0.7"/>

    <!-- Thumb Contour -->
    <path d="M 240,180 C 270,210 295,240 280,255 C 265,265 240,250 225,230 C 215,215 220,195 240,180 Z" fill="#1A1A1A" opacity="0.5"/>
    <path d="M 245,185 C 272,212 290,238 276,250" fill="none" stroke="#F5F5F5" stroke-width="1.2" opacity="0.7"/>
  </g>

  <!-- ==================== RIGHT HAND (ADAM'S HAND) ==================== -->
  <g id="rightHandGroup">
    <!-- Outer Glow Silhouette -->
    <path d="M 1220,400 
             C 1120,370 1040,340 970,310 
             C 920,290 875,270 825,255 
             C 785,243 730,238 670,233 
             C 620,230 580,230 556,231
             C 552,231 552,233 557,235
             C 585,245 615,260 645,270
             C 680,282 710,285 740,295
             C 770,305 800,325 830,345
             C 890,380 970,410 1220,450 Z" 
          fill="#D4AF37" opacity="0.2" filter="url(#neonGlow)"/>

    <!-- Main Right Hand Solid Path -->
    <path d="M 1230,410 
             C 1130,378 1045,346 978,315 
             C 930,293 885,272 835,256 
             C 795,244 738,238 675,233 
             C 622,229 578,229 555,231
             C 550,231.5 550,233.5 556,235
             C 580,242 610,253 632,258
             C 642,260 640,266 630,265
             C 605,262 585,254 575,252
             C 570,251 568,255 574,258
             C 595,268 620,275 610,280
             C 595,285 575,278 565,272
             C 560,269 557,273 563,277
             C 580,288 600,295 590,300
             C 575,305 545,295 530,288
             C 515,280 525,270 545,270
             C 565,270 600,285 625,290
             C 660,298 695,300 730,310
             C 770,322 810,345 845,365
             C 910,400 990,430 1230,470 Z" 
          fill="url(#handRightGrad)" stroke="#8A6A15" stroke-width="1.5"/>

    <!-- Right Hand Details & Shading Lines -->
    <path d="M 1080,330 C 1000,300 920,275 840,255" fill="none" stroke="#090909" stroke-width="2" opacity="0.7"/>
    <path d="M 1010,320 C 930,290 850,268 740,248" fill="none" stroke="#F5F5F5" stroke-width="1.5" opacity="0.8"/>
    <path d="M 900,280 C 830,260 750,245 660,236" fill="none" stroke="#D4AF37" stroke-width="1.2" opacity="0.9"/>

    <!-- Finger Joints -->
    <path d="M 810,250 C 740,240 660,234 558,231" fill="none" stroke="#090909" stroke-width="1.8" opacity="0.5"/>
    <path d="M 750,243 Q 745,250 738,253" fill="none" stroke="#8A6A15" stroke-width="1.5"/>
    <path d="M 680,237 Q 675,244 668,247" fill="none" stroke="#8A6A15" stroke-width="1.5"/>

    <!-- Middle Finger Curl -->
    <path d="M 790,258 C 730,252 670,254 631,259 C 625,260 626,265 635,265 C 665,263 710,264 760,270" fill="#1A1A1A" opacity="0.5"/>
    <path d="M 710,256 C 670,258 638,262 633,264" fill="none" stroke="#D4AF37" stroke-width="1" opacity="0.6"/>

    <!-- Ring Finger Curl -->
    <path d="M 770,270 C 710,268 650,272 612,277 C 606,278 608,283 618,282 C 648,279 690,280 740,288" fill="#090909" opacity="0.6"/>

    <!-- Pinky Finger Curl -->
    <path d="M 750,282 C 690,282 630,288 592,295 C 586,296 588,301 598,300 C 628,296 670,296 720,305" fill="#090909" opacity="0.7"/>

    <!-- Thumb Contour -->
    <path d="M 910,290 C 870,260 830,240 805,250 C 790,258 805,280 835,300 C 860,315 890,310 910,290 Z" fill="#1A1A1A" opacity="0.5"/>
    <path d="M 900,285 C 865,258 832,245 812,253" fill="none" stroke="#F5F5F5" stroke-width="1.2" opacity="0.7"/>
  </g>

  <!-- ==================== GOLD SPARK / ENERGY ARC ==================== -->
  <g id="sparkGroup" filter="url(#intenseSpark)">
    <!-- Core Energy Burst -->
    <ellipse cx="540" cy="228" rx="18" ry="12" fill="#F5F5F5" opacity="0.98"/>
    <ellipse cx="540" cy="228" rx="35" ry="20" fill="#D4AF37" opacity="0.85"/>
    <ellipse cx="540" cy="228" rx="65" ry="35" fill="#8A6A15" opacity="0.5"/>

    <!-- Electric Arc Rays -->
    <path d="M 525,225 Q 533,222 540,228 T 555,231" fill="none" stroke="#F5F5F5" stroke-width="2.5"/>
    <path d="M 525,225 Q 535,234 540,228 T 555,231" fill="none" stroke="#D4AF37" stroke-width="1.8"/>
    
    <!-- Micro Gold Spark Stars -->
    <path d="M 540,210 L 542,224 L 556,226 L 542,228 L 540,242 L 538,228 L 524,226 L 538,224 Z" fill="#F5F5F5"/>
    <path d="M 540,216 L 541,225 L 550,226 L 541,227 L 540,236 L 539,227 L 530,226 L 539,225 Z" fill="#D4AF37"/>
    
    <!-- Radiating Arc Rings -->
    <circle cx="540" cy="228" r="28" fill="none" stroke="#D4AF37" stroke-width="1" stroke-dasharray="4 8" opacity="0.8"/>
    <circle cx="540" cy="228" r="48" fill="none" stroke="#8A6A15" stroke-width="0.8" stroke-dasharray="2 12" opacity="0.6"/>
  </g>

  <!-- ==================== LUXURY GOLD WINDOW (PROJECT .EXE) ==================== -->
  <g id="windowGroup" filter="url(#windowShadow)">
    <!-- Window Outer Glass Frame -->
    <rect x="410" y="110" width="380" height="240" rx="8" fill="#1A1A1A" fill-opacity="0.88" stroke="#8A6A15" stroke-width="1.5"/>
    <rect x="410" y="110" width="380" height="240" rx="8" fill="none" stroke="#D4AF37" stroke-width="1" stroke-opacity="0.5"/>

    <!-- Window Title Bar -->
    <path d="M 410,118 A 8,8 0 0 1 418,110 L 782,110 A 8,8 0 0 1 790,118 L 790,146 L 410,146 Z" fill="#090909"/>
    <line x1="410" y1="146" x2="790" y2="146" stroke="#8A6A15" stroke-width="1"/>

    <!-- Title Bar Text -->
    <text x="430" y="133" fill="#D4AF37" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" font-weight="700" letter-spacing="1.5">PROJECT .EXE</text>

    <!-- Gold Window Controls [ _ ] [ □ ] [ ✕ ] -->
    <g transform="translate(710, 122)">
      <!-- Minimize -->
      <rect x="0" y="0" width="18" height="14" rx="2" fill="#1A1A1A" stroke="#8A6A15" stroke-width="1"/>
      <line x1="4" y1="10" x2="14" y2="10" stroke="#D4AF37" stroke-width="1.5"/>

      <!-- Maximize -->
      <rect x="24" y="0" width="18" height="14" rx="2" fill="#1A1A1A" stroke="#8A6A15" stroke-width="1"/>
      <rect x="28" y="3" width="10" height="8" fill="none" stroke="#D4AF37" stroke-width="1.2"/>

      <!-- Close -->
      <rect x="48" y="0" width="18" height="14" rx="2" fill="#1A1A1A" stroke="#8A6A15" stroke-width="1"/>
      <path d="M 52,3 L 62,11 M 62,3 L 52,11" stroke="#D4AF37" stroke-width="1.5"/>
    </g>

    <!-- Window Interior Content / Code Lines -->
    <g transform="translate(430, 168)" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11">
      <!-- Status Line 1 -->
      <text y="0" fill="#D4AF37" font-weight="600">&gt; INITIALIZING HUMAN_AI_INTERFACE...</text>

      <!-- Code Line 2 -->
      <text y="22" fill="#F5F5F5">
        <tspan fill="#D4AF37">const</tspan> 
        <tspan fill="#F5F5F5"> spark</tspan> = 
        <tspan fill="#8A6A15">await</tspan> 
        <tspan fill="#D4AF37">connect</tspan>(<tspan fill="#F5F5F5">god</tspan>, <tspan fill="#F5F5F5">adam</tspan>);
      </text>

      <!-- Code Line 3 -->
      <text y="44" fill="#F5F5F5">
        <tspan fill="#D4AF37">if</tspan> (spark.<tspan fill="#8A6A15">status</tspan> === <tspan fill="#D4AF37">'CONNECTED'</tspan>) {
      </text>

      <!-- Code Line 4 -->
      <text y="66" fill="#F5F5F5">
        <tspan fill="#8A6A15" dx="12">render</tspan>(<tspan fill="#D4AF37">"GOLD_CREATION_OF_CODE.SVG"</tspan>);
      </text>

      <!-- Code Line 5 -->
      <text y="88" fill="#F5F5F5">}</text>

      <!-- Console Output Badge -->
      <g transform="translate(0, 106)">
        <rect x="0" y="0" width="340" height="24" rx="4" fill="#090909" stroke="#8A6A15" stroke-width="1"/>
        <circle cx="12" cy="12" r="4" fill="#D4AF37"/>
        <text x="24" y="16" fill="#D4AF37" font-size="10" font-weight="600">PALETTE: #090909 #1A1A1A #F5F5F5 #D4AF37 #8A6A15</text>
      </g>
    </g>

    <!-- Inner Window Border Accent Glow -->
    <rect x="411" y="111" width="378" height="238" rx="7" fill="none" stroke="#D4AF37" stroke-width="0.5" stroke-opacity="0.3"/>
  </g>

  <!-- High-Tech Corner Crosshair Markers -->
  <g stroke="#D4AF37" stroke-width="1" opacity="0.6">
    <path d="M 20,30 L 20,20 L 30,20"/>
    <path d="M 1180,30 L 1180,20 L 1170,20"/>
    <path d="M 20,430 L 20,440 L 30,440"/>
    <path d="M 1180,430 L 1180,440 L 1170,440"/>
  </g>
</svg>
